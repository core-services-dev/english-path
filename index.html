<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="English Path">
<meta name="theme-color" content="#cfeaff">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>English Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}/* Layout concept: one full-height play surface; a slim top bar; big touch targets centered in the space left. */
:root {
  --sky: #cfeaff; --sky-deep: #9dd2fb; --ink: #1c2a4a; --ink-soft: #4a5a7d;
  --sun: #ffc53d; --sun-2: #ffe08a; --coral: #ff6f5b; --coral-2: #ffc0b4;
  --leaf: #2fb171; --leaf-2: #b5ebcd; --grape: #7a5cff; --grape-2: #d3c8ff; --sky-2: #bfe3ff;
  --card: #ffffff; --card-edge: #d7e7f6; --line: #c8dbee; --trace-bg: #dfe9f5; --trace-faint: #edf3fa;
  --ink-trace: #2f7de1; --demo: #ff9f1c; --arrow: #8aa4c4; --start: #22b05e;
  --known: #2fb171; --prac: #ffc53d; --weak: #ff8a6e; --none: #e6edf5;
  --display: "Lilita One", "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif;
  --body: "Andika", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --r: 26px;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--sky); color: var(--ink); font-family: var(--body); font-size: 17px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus-visible { outline: 4px solid var(--grape); outline-offset: 3px; }
#app { height: 100%; display: grid; grid-template-rows: auto 1fr; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; background: radial-gradient(120% 70% at 50% 110%, #b9e8c9 0 22%, transparent 22.3%), linear-gradient(var(--sky), #e4f4ff 70%); }
.ic { display: inline-flex; width: 1em; height: 1em; }
.ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* top bar */
#topbar { display: flex; align-items: center; gap: 12px; padding-block: 10px 4px; min-height: 64px; }
.tb-btn { width: 58px; height: 58px; border-radius: 20px; background: var(--card); box-shadow: 0 3px 0 var(--card-edge); display: grid; place-items: center; font-size: 30px; color: var(--ink); }
.tb-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--card-edge); }
.tb-replay { background: var(--sun); box-shadow: 0 3px 0 #e0a41a; width: 72px; }
.tb-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.ru-tag { font-family: var(--display); font-size: 20px; letter-spacing: .04em; color: var(--grape); }
.tb-stars { display: flex; align-items: center; gap: 4px; background: var(--card); border-radius: 999px; padding: 8px 16px; font-family: var(--display); font-size: 24px; box-shadow: 0 3px 0 var(--card-edge); font-variant-numeric: tabular-nums; }
.tb-stars.bump { animation: bump .5s; }
.lesson-prog { display: flex; gap: 8px; align-items: center; }
.lp-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--card); border: 3px solid var(--card-edge); }
.lp-dot.done { background: var(--leaf); border-color: var(--leaf); }
.lp-dot.now { background: var(--sun); border-color: #e0a41a; transform: scale(1.25); }

.stage { position: relative; overflow: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding-block: 8px 20px; min-height: 0; }

/* prompt */
.prompt { display: flex; align-items: center; justify-content: center; gap: 22px; min-height: 120px; }
.big-ear { width: 128px; height: 128px; border-radius: 50%; background: var(--sun); box-shadow: 0 6px 0 #e0a41a; font-size: 64px; display: grid; place-items: center; animation: breathe 2.4s ease-in-out infinite; }
.big-ear:active { transform: translateY(4px); box-shadow: 0 2px 0 #e0a41a; }
.prompt-pic { background: var(--card); border-radius: 36px; padding: 10px 26px; box-shadow: 0 6px 0 var(--card-edge); }
.ex-box { min-width: 0; }
.ex-box .pic { font-size: 70px; }

/* pictures */
.pic.emoji { font-size: clamp(64px, 11vw, 112px); line-height: 1.15; display: inline-block; }
.pic.emoji.xl { font-size: clamp(90px, 15vw, 150px); }
.pic.emoji.xxl { font-size: clamp(120px, 22vw, 210px); }
.pic.emoji.sm { font-size: 54px; }
.pic.swatch { display: inline-block; width: clamp(76px, 12vw, 120px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--sw); border: 5px solid rgba(28, 42, 74, .14); }
.pic.swatch.xl, .pic.swatch.xxl { width: clamp(120px, 20vw, 190px); }
.pic.dots { display: inline-grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 8px; }
.pic.dots[data-n="1"], .pic.dots[data-n="2"], .pic.dots[data-n="3"], .pic.dots[data-n="4"] { grid-template-columns: repeat(var(--cols, 2), 1fr); }
.pic.dots[data-n="1"] { --cols: 1; } .pic.dots[data-n="3"] { --cols: 3; }
.pic.dots i { width: clamp(18px, 3vw, 28px); aspect-ratio: 1; border-radius: 50%; background: var(--coral); box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
.pic.dots.xxl i, .pic.dots.xl i { width: clamp(26px, 4.5vw, 40px); }

/* options */
.opts { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(14px, 3vw, 30px); max-width: 980px; }
.card { background: var(--card); border-radius: var(--r); box-shadow: 0 7px 0 var(--card-edge); min-width: clamp(140px, 21vw, 210px); min-height: clamp(140px, 21vw, 200px); display: grid; place-items: center; padding: 12px; position: relative; transition: transform .15s, opacity .3s, box-shadow .15s; }
.card:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--card-edge); }
.card.right { background: #e3f8eb; box-shadow: 0 7px 0 var(--leaf), 0 0 0 6px var(--leaf); animation: pop .45s; }
.card.dim { opacity: .35; }
.glow { animation: glow 1.1s ease-in-out infinite; }
.shake { animation: shake .45s; }
.opts.solved .card:not(.right) { opacity: .4; }

.lt { font-family: var(--body); font-weight: 700; font-size: clamp(76px, 12vw, 120px); line-height: 1; color: var(--ink); }
.lt.pair { display: flex; align-items: baseline; gap: 6px; }
.lt.pair small { font-size: .82em; }
.lt-card { min-width: clamp(150px, 20vw, 200px); }
.case-show .lt { font-size: clamp(120px, 20vw, 180px); background: var(--card); padding: 6px 40px; border-radius: 36px; box-shadow: 0 6px 0 var(--card-edge); display: inline-block; }

/* sound cards */
.snd-card { min-width: clamp(150px, 21vw, 200px); }
.snd-dot { width: clamp(108px, 15vw, 140px); aspect-ratio: 1; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 56px; box-shadow: inset 0 -8px 0 rgba(0,0,0,.14); position: relative; }
.snd-letter { position: absolute; bottom: -6px; right: -6px; background: var(--card); color: var(--ink); border-radius: 16px; font-size: 32px; padding: 0 10px; box-shadow: 0 3px 0 var(--card-edge); }
.snd-card.lit { transform: scale(1.09); box-shadow: 0 7px 0 var(--card-edge), 0 0 0 6px var(--sun); }
.peek { position: absolute; top: -14px; right: -14px; width: 54px; height: 54px; border-radius: 50%; background: var(--sun-2); display: grid; place-items: center; font-size: 28px; box-shadow: 0 3px 0 #e8c25a; }

/* same / different */
.spk-row { display: flex; gap: clamp(30px, 8vw, 100px); }
.spk { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.spk-face { font-size: clamp(80px, 12vw, 120px); display: inline-block; }
.spk.talk .spk-face { animation: talk .6s; }
.spk-pic .pic.emoji { font-size: 56px; }
.spk-pic .pic.swatch { width: 54px; }
.two-big .card { min-width: clamp(180px, 28vw, 260px); }
.sd-ic { display: flex; gap: 14px; }
.sh { width: 66px; height: 66px; border-radius: 50%; display: inline-block; }
.sh.c1 { background: var(--grape); } .sh.c2 { background: var(--coral); }
.sh.tri { border-radius: 8px; clip-path: polygon(50% 4%, 96% 92%, 4% 92%); }

/* tracing */
.trace-wrap { display: flex; gap: 18px; align-items: center; width: 100%; max-width: 960px; flex: 1; min-height: 0; }
.trace-cv { flex: 1; min-width: 0; height: 100%; min-height: 320px; background: var(--card); border-radius: 32px; box-shadow: 0 7px 0 var(--card-edge); touch-action: none; }
.trace-side { display: flex; flex-direction: column; gap: 16px; align-items: center; }
.trace-model .lt { font-size: 64px; }
.round-btn { width: 76px; height: 76px; border-radius: 50%; background: var(--card); box-shadow: 0 4px 0 var(--card-edge); font-size: 38px; display: grid; place-items: center; }
.round-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--card-edge); }

/* build */
.slots { display: flex; gap: 16px; }
.slot { width: clamp(100px, 14vw, 130px); height: clamp(116px, 16vw, 150px); border-radius: 24px; border: 5px dashed var(--sky-deep); background: rgba(255,255,255,.55); display: grid; place-items: center; transition: transform .2s; }
.slot .ghost { font-family: var(--body); font-weight: 700; font-size: clamp(66px, 10vw, 100px); color: var(--trace-bg); }
.slot.filled { border-style: solid; border-color: var(--leaf); background: var(--card); }
.slot .lt { font-size: clamp(66px, 10vw, 100px); }
.slot.lit { transform: translateY(-10px) scale(1.06); border-color: var(--sun); }
.slots.blend .slot { border-color: var(--leaf); animation: pop .5s; }
.tray { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; min-height: 140px; }
.tile { width: clamp(100px, 13vw, 124px); height: clamp(110px, 14vw, 134px); border-radius: 22px; background: var(--sun-2); box-shadow: 0 6px 0 #e8c25a; display: grid; place-items: center; touch-action: none; position: relative; z-index: 1; }
.tile .lt { font-size: clamp(62px, 9vw, 90px); }
.tile.lift { z-index: 5; box-shadow: 0 14px 24px rgba(28,42,74,.25); }
.tile.used { visibility: hidden; }

/* read */
.read-word { display: flex; gap: 4px; background: var(--card); border-radius: 32px; padding: 6px 34px; box-shadow: 0 6px 0 var(--card-edge); }
.read-word .rl { font-weight: 700; font-size: clamp(84px, 13vw, 130px); line-height: 1.1; transition: color .2s, transform .2s; display: inline-block; }
.read-word .rl.lit { color: var(--coral); transform: translateY(-8px); }
.read-word.blend { box-shadow: 0 6px 0 var(--leaf), 0 0 0 6px var(--leaf); }

/* listen & do */
.scene { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(12px, 2.4vw, 24px); max-width: 860px; width: 100%; }
.scene.n4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.scene-item { background: var(--card); border-radius: var(--r); box-shadow: 0 6px 0 var(--card-edge); aspect-ratio: 1.15; max-width: 100%; display: grid; place-items: center; }
.scene-item.right { background: #e3f8eb; box-shadow: 0 6px 0 var(--leaf), 0 0 0 5px var(--leaf); }
.shape { width: clamp(70px, 11vw, 110px); aspect-ratio: 1; max-width: 100%; display: block; }
.shape svg { width: 100%; height: 100%; }

/* talk */
.talk { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.talk-pic { padding: 14px 40px; }
.phrase-text { font-size: clamp(26px, 4vw, 40px); font-weight: 700; color: var(--ink-soft); text-align: center; max-width: 30ch; text-wrap: balance; }
.talk-ctrls { display: flex; gap: 20px; align-items: center; }
.mic-btn { width: 128px; height: 128px; border-radius: 50%; background: var(--coral); color: #fff; font-size: 62px; display: grid; place-items: center; box-shadow: 0 6px 0 #d4513f; }
.mic-btn.busy { animation: rec 1s ease-in-out infinite; }
.mic-btn.thumb { background: var(--leaf); box-shadow: 0 6px 0 #22885a; }
.talk-status { min-height: 30px; font-size: 22px; color: var(--ink-soft); }

/* words */
.cat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; max-width: 760px; width: 100%; }
.cat-tile { background: var(--card); border-radius: var(--r); box-shadow: 0 6px 0 var(--card-edge); padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.cat-tile .pic.emoji { font-size: clamp(60px, 9vw, 90px); }
.cat-tile small { font-size: 18px; color: var(--ink-soft); text-transform: capitalize; }
.wcard { display: flex; align-items: center; gap: 18px; width: 100%; max-width: 980px; justify-content: center; }
.wc-main { background: var(--card); border-radius: 40px; box-shadow: 0 8px 0 var(--card-edge); padding: 22px 50px 26px; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; min-width: 0; }
.wc-word { font-size: clamp(44px, 7vw, 72px); font-weight: 700; }
.nav-btn { width: 96px; height: 96px; border-radius: 50%; background: var(--card); box-shadow: 0 5px 0 var(--card-edge); font-size: 50px; display: grid; place-items: center; flex: none; }
.nav-btn.next { background: var(--leaf); color: #fff; box-shadow: 0 5px 0 #22885a; }
.nav-btn.next.pulse { animation: breathe 1.4s ease-in-out infinite; }
.nav-btn:disabled { opacity: .25; }
.ru-btn { position: absolute; top: 14px; right: 14px; width: 62px; height: 62px; }

/* home */
.stage.home { justify-content: center; gap: 26px; }
.home-hero { display: flex; align-items: center; gap: clamp(16px, 4vw, 40px); }
.mascot { font-size: clamp(80px, 12vw, 120px); line-height: 1; }
.mascot .m-face { display: inline-block; animation: bob 3s ease-in-out infinite; }
.mascot.wave .m-face { animation: wave 1.6s ease-in-out infinite; }
.mascot.happy .m-face { animation: pop .6s 3; }
.lesson-btn { width: clamp(170px, 26vw, 230px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--sun); box-shadow: 0 10px 0 #e0a41a, 0 0 0 10px rgba(255,255,255,.6); display: grid; place-items: center; position: relative; animation: breathe 2.6s ease-in-out infinite; }
.lesson-btn.done { background: var(--leaf-2); box-shadow: 0 10px 0 #8fd3ad, 0 0 0 10px rgba(255,255,255,.6); animation: none; }
.lb-sun { position: absolute; top: -18px; right: -12px; font-size: 64px; }
.play-tri { width: 0; height: 0; border-left: 64px solid var(--card); border-top: 40px solid transparent; border-bottom: 40px solid transparent; margin-left: 16px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.12)); }
.sticker-btn { background: var(--card); border-radius: 24px; padding: 12px 18px; font-size: 52px; box-shadow: 0 5px 0 var(--card-edge); display: flex; align-items: center; gap: 6px; }
.sticker-btn b { font-family: var(--display); font-size: 28px; }
.game-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(10px, 2vw, 18px); width: 100%; max-width: 1040px; }
.game-tile { background: var(--card); border-radius: 24px; box-shadow: 0 6px 0 var(--card-edge); padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; overflow: hidden; }
.game-tile::before { content: ""; position: absolute; inset: 0 0 46%; background: var(--tc); opacity: .7; }
.gt-ic { font-size: clamp(46px, 7vw, 66px); position: relative; }
.game-tile small { font-size: 15px; color: var(--ink-soft); position: relative; line-height: 1.15; text-align: center; }
.parent-btn { position: absolute; right: 4px; bottom: max(8px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; align-items: center; font-size: 15px; color: var(--ink-soft); background: rgba(255,255,255,.7); padding: 8px 14px; border-radius: 999px; }
.parent-btn .ic { font-size: 18px; }

/* start, reward, transition */
.stage.start, .stage.reward { justify-content: center; }
.start-box, .reward-box { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.start-btn { width: 210px; height: 210px; border-radius: 50%; background: var(--leaf); box-shadow: 0 10px 0 #22885a, 0 0 0 12px rgba(255,255,255,.6); display: grid; place-items: center; animation: breathe 2s ease-in-out infinite; }
.brand { font-family: var(--display); font-size: 40px; letter-spacing: .02em; color: var(--ink); }
.warn { background: #fff3d6; border-radius: 14px; padding: 10px 16px; color: #7a4b00; font-size: 16px; max-width: 46ch; user-select: text; }
.sticker-new { font-size: 170px; animation: reveal 1s cubic-bezier(.2,1.6,.4,1); }
.reward-stars { font-size: 80px; }
.big-go { width: 120px; height: 120px; border-radius: 50%; background: var(--leaf); color: #fff; font-size: 64px; display: grid; place-items: center; box-shadow: 0 6px 0 #22885a; }
.trans-card { width: 220px; height: 220px; border-radius: 50%; background: var(--tc); display: grid; place-items: center; animation: reveal .7s cubic-bezier(.2,1.6,.4,1); }
.hello { display: grid; place-items: center; }
.sticker-book { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; max-width: 760px; width: 100%; }
.stk { aspect-ratio: 1; max-width: 100%; border-radius: 22px; background: rgba(255,255,255,.5); border: 4px dashed var(--sky-deep); display: grid; place-items: center; font-size: clamp(40px, 7vw, 64px); }
.stk.have { background: var(--card); border: 0; box-shadow: 0 5px 0 var(--card-edge); }

/* bubbles & confetti */
.ru-bubble { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--card); color: var(--ink); border-radius: 22px; padding: 14px 22px; font-size: 22px; box-shadow: 0 8px 30px rgba(28,42,74,.25); max-width: min(90vw, 640px); z-index: 30; border: 3px solid var(--grape-2); user-select: text; }
.confetti span { position: fixed; z-index: 40; font-size: 34px; pointer-events: none; animation: fly 1.1s ease-out forwards; }

/* parent gate */
.gate-box { display: flex; flex-direction: column; align-items: center; gap: 16px; font-size: 40px; color: var(--ink-soft); }
.gate-q { font-size: 22px; color: var(--ink); text-align: center; max-width: 34ch; margin: 0; }
.keypad { display: grid; grid-template-columns: repeat(3, 84px); gap: 12px; }
.key { height: 76px; border-radius: 18px; background: var(--card); box-shadow: 0 4px 0 var(--card-edge); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.key.ok { background: var(--leaf-2); }

/* parent area */
.stage.parent { display: block; padding-block: 0 40px; background: var(--card); border-radius: 26px 26px 0 0; user-select: text; -webkit-user-select: text; }
.p-head { position: sticky; top: 0; background: var(--card); z-index: 2; padding: 16px 20px 0; border-bottom: 2px solid var(--line); }
.p-head h1 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0 0 8px; }
.p-tabs { display: flex; gap: 6px; overflow-x: auto; }
.p-tab { padding: 10px 16px; border-radius: 14px 14px 0 0; font-size: 17px; color: var(--ink-soft); white-space: nowrap; }
.p-tab.on { background: var(--sky); color: var(--ink); font-weight: 700; }
.p-body { padding: 8px 20px 20px; max-width: 980px; }
.p-body h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 26px 0 8px; letter-spacing: .01em; }
.p-lead { margin: 10px 0; font-size: 17px; line-height: 1.5; }
.p-note { color: var(--ink-soft); font-size: 15px; line-height: 1.5; margin: 6px 0; max-width: 70ch; }
.dom-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-top: 14px; }
.dom-card { border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px; min-width: 0; }
.dom-card h3 { margin: 0; font-size: 19px; }
.dom-desc { margin: 2px 0 8px; color: var(--ink-soft); font-size: 14px; }
.dom-num { display: flex; flex-direction: column; gap: 0; }
.emo-ic { font-size: 40px; line-height: 1; }
.dom-num b { font-family: var(--display); font-weight: 400; font-size: 36px; font-variant-numeric: tabular-nums; }
.dom-num span, .dom-sub { font-size: 13px; color: var(--ink-soft); }
.spark { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--ink-soft); }
.spark svg { width: 100%; max-width: 220px; height: auto; }
.sp-line { fill: none; stroke: var(--ink-trace); stroke-width: 2.5; }
.sp-dot circle { fill: var(--ink-trace); }
.sp-base { stroke: var(--line); stroke-width: 1.5; }
.sp-grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
.grid-letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; }
.lg { border-radius: 14px; padding: 6px 4px; text-align: center; background: var(--none); }
.lg b { font-size: 22px; display: block; }
.lg.known { background: #cdf0db; } .lg.prac { background: #fff0c4; } .lg.weak { background: #ffd8cd; }
.lg-sub { display: flex; justify-content: center; gap: 4px; margin-top: 2px; }

/* ---------------- Audio ---------------- */
const Snd = {
  ctx: null, bufs: new Map(), custom: new Map(), src: null, id: 0,
  unlock() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!this.ctx) {
      try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
      this.ctx = new AC();
      try { const b = this.ctx.createBuffer(1, 1, 22050), s = this.ctx.createBufferSource(); s.buffer = b; s.connect(this.ctx.destination); s.start(0); } catch (e) {}
      loadRecordings();
    }
    if (this.ctx.state !== "running") this.ctx.resume().catch(() => {});
  },
  decode(ab) { return new Promise((res, rej) => this.ctx.decodeAudioData(ab, res, rej)); },
  async buf(k) {
    if (this.custom.has(k)) return this.custom.get(k);
    if (this.bufs.has(k)) return this.bufs.get(k);
    const b64 = AUD[k];
    if (!b64 || !this.ctx) return null;
    const bin = atob(b64), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const p = this.decode(u.buffer).catch(() => null);
    this.bufs.set(k, p);
    return p;
  },
  stop() {
    this.id++;
    if (this.src) { try { this.src.onended = null; this.src.stop(); } catch (e) {} this.src = null; }
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
  },
  one(k, id) {
    return new Promise(async res => {
      if (this.ctx && this.ctx.state !== "running") { try { await this.ctx.resume(); } catch (e) {} }
      const b = await this.buf(k);
      if (id !== this.id) return res(false);
      if (!b) {
        const t = textFor(k);
        if (t) { await speakTTS(t, "en-US"); return res(id === this.id); }
        return res(true);
      }
      const s = this.ctx.createBufferSource();
      s.buffer = b; s.connect(this.ctx.destination); this.src = s;
      const rate = window.__RATE || 1; if (rate !== 1) s.playbackRate.value = rate;
      const guard = setTimeout(() => res(id === this.id), b.duration * 1000 / rate + 1500);
      s.onended = () => { clearTimeout(guard); if (this.src === s) this.src = null; res(id === this.id); };
      s.start(0);
    });
  },
  async say(...list) {
    this.stop();
    const id = this.id;
    for (const it of list.flat()) {
      if (id !== this.id) return false;
      if (it == null || it === false) continue;
      if (typeof it === "number") { await sleep(it); continue; }
      if (typeof it === "function") { try { it(); } catch (e) {} continue; }
      if (!(await this.one(it, id))) return false;
    }
    return id === this.id;
  },
  preload(keys) { if (this.ctx) keys.forEach(k => this.buf(k)); },
};
function textFor(k) {
  const [t, id] = [k.slice(0, k.indexOf(":")), k.slice(k.indexOf(":") + 1)];
  if (t === "w") return WORD[id] ? WORD[id].en : id;
  if (t === "ws") return WORD[id] && WORD[id].sent;
  if (t === "p") return C.prompts[id];
  if (t === "f" || t === "fs") return PHRASE[id] && PHRASE[id].en;
  if (t === "i") return INSTR[id] && INSTR[id].text;
  if (t === "ln") return id.toUpperCase();
  return null;
}
function ttsVoice(lang) {
  try {
    const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith(lang.slice(0, 2).toLowerCase()));
    return vs.find(v => /enhanced|premium/i.test(v.name)) || vs.find(v => v.localService) || vs[0] || null;
  } catch (e) { return null; }
}
function speakTTS(text, lang) {
  return new Promise(res => {
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) return res(false);
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang; u.rate = lang.startsWith("ru") ? 0.9 : 0.85;
      const v = ttsVoice(lang); if (v) u.voice = v;
      const t = setTimeout(() => res(true), 2500 + text.length * 120);
      u.onend = () => { clearTimeout(t); res(true); };
      u.onerror = () => { clearTimeout(t); res(false); };
      speechSynthesis.speak(u);
    } catch (e) { res(false); }
  });
}

const DOMAIN = { listen: "listening", instr: "listening", samediff: "sound", firstsound: "sound", letter: "letters", case: "letters", trace: "letters", build: "reading", read: "reading", speak: "speaking" };
const LEVEL_OF = { case: "letter" };
function today(d = new Date()) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function day() { const t = today(); return S.days[t] || (S.days[t] = { ms: 0, dom: {} }); }
function record(game, key, ok) {
  const it = S.items[key] || (S.items[key] = { n: 0, c: 0, h: [], t: 0 });
  it.n++; if (ok) it.c++; it.h.push(ok ? 1 : 0); if (it.h.length > 6) it.h.shift(); it.t = Date.now();
  const dm = DOMAIN[game] || "other"; const a = day().dom[dm] || (day().dom[dm] = [0, 0]); a[1]++; if (ok) a[0]++;
  const g = S.gh[game] || (S.gh[game] = []); g.push(ok ? 1 : 0); if (g.length > 8) g.shift();
  if (ok) S.stars++;
  if (Run.session) { Run.session.n++; if (ok) Run.session.c++; }
  adaptLevel(game); checkUnlocks(); save(); updateStars();
}
function mastered(key) {
  const it = S.items[key]; if (!it) return false;
  const l3 = it.h.slice(-3);
  return it.c >= 2 && l3.reduce((a, b) => a + b, 0) >= 2 && l3[l3.length - 1] === 1;
}
function practicing(key) { return !!S.items[key] && !mastered(key); }
function needsPractice(key) {
  const it = S.items[key]; if (!it || it.n < 2) return false;
  const r = it.h.slice(-4); return r.reduce((a, b) => a + b, 0) / r.length < 0.6;
}
function lvl(game) { return S.settings.levels[LEVEL_OF[game] || game] || 1; }
function adaptLevel(game) {
  const lg = LEVEL_OF[game] || game;
  if (!(lg in S.settings.levels) || S.settings.manual[lg]) return;
  const g = S.gh[game], L = S.settings.levels, sum = a => a.reduce((x, y) => x + y, 0);
  if (g.length >= 6 && sum(g.slice(-6)) >= 5 && L[lg] < 3) { L[lg]++; S.gh[game] = []; }
  else if (g.length >= 4 && sum(g.slice(-4)) <= 1 && L[lg] > 1) { L[lg]--; S.gh[game] = []; }
}
function unlockedSounds() { return C.soundOrder.slice(0, Math.max(2, S.unlocked.sounds)); }
function unlockedLetters() { return C.letterOrder.slice(0, Math.max(2, S.unlocked.letters)); }
function checkUnlocks() {
  const us = unlockedSounds();
  if (S.unlocked.sounds < C.soundOrder.length && us.filter(s => mastered("fs:" + s)).length >= Math.ceil(us.length * 0.7)) S.unlocked.sounds++;
  const ul = unlockedLetters();
  if (S.unlocked.letters < C.letterOrder.length && ul.filter(l => mastered("ls:" + l)).length >= Math.ceil(ul.length * 0.7)) S.unlocked.letters++;
}
const recentKeys = [];
function choose(cands, keyOf, opt = {}) {
  if (!cands.length) return null;
  const now = Date.now();
  const ws = cands.map(c => {
    const k = keyOf(c), it = S.items[k];
    let w;
    if (opt.review) w = mastered(k) ? 3 : 0.3;
    else if (!it) w = 3;
    else if (!mastered(k)) w = needsPractice(k) ? 5 : 3.5;
    else w = now - it.t > 20 * 3600e3 ? 1.6 : 0.5;
    if (recentKeys.includes(k)) w *= 0.06;
    return w;
  });
  let s = ws.reduce((a, b) => a + b, 0) * Math.random();
  for (let i = 0; i < cands.length; i++) {
    s -= ws[i];
    if (s <= 0) { const k = keyOf(cands[i]); recentKeys.push(k); if (recentKeys.length > 5) recentKeys.shift(); return cands[i]; }
  }
  return cands[cands.length - 1];
}

// opts: game, key, items:[{el, ok}], stim(), hint(correctEl), onCorrect(el), cls, placement
function choiceRound(tok, o) {
  return new Promise(resolve => {
    const grid = h("div", { class: "opts " + (o.cls || "") + " n" + o.items.length });
    let tries = 0, done = false;
    o.items.forEach(it => {
      const b = it.el;
      b.classList.add("opt");
      if (window.__TEST && it.ok) b.dataset.ok = "1";
      b.addEventListener("click", async (e) => {
        if (done || b.disabled || !alive(tok)) return;
        if (e.target.closest(".peek")) return;
        if (it.ok) {
          done = true;
          b.classList.add("right"); grid.classList.add("solved");
          const first = tries === 0;
          if (!o.placement) record(o.game, o.key, first);
          if (first) confetti(b);
          await o.onCorrect(b, first);
          if (alive(tok)) resolve(first);
        } else {
          tries++;
          b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 500);
          if (o.placement) { done = true; Snd.stop(); await sleep(300); return resolve(false); }
          b.disabled = true; b.classList.add("dim");
          if (tries === 1) { await Snd.say("p:listen_again", 200); if (alive(tok) && !done) o.stim(false); }
          else { const c = o.items.find(x => x.ok).el; c.classList.add("glow"); o.hint && o.hint(c); }
        }
      });
      grid.append(b);
    });
    stage.append(grid);
    SCR.replay = () => o.stim(false);
    o.stim(true);
  });
}

/* 1. Listen & Choose */
GAMES.listen = async (c) => {
  const L = lvl("listen");
  let n = [2, 3, 4][L - 1]; if (c.easier) n = Math.max(2, n - 1);
  let pool = (c.pool || S.introduced).map(id => WORD[id]).filter(Boolean);
  if (L < 2 && !c.pool) pool = pool.filter(w => !w.pic.startsWith("n:") && !w.pic.startsWith("#"));
  if (pool.length < n + 1) pool = uniq(pool.concat(STARTER.map(i => WORD[i])));
  const target = (c.reuse && pool.includes(c.reuse)) ? c.reuse : choose(pool, w => "w:" + w.id, c);
  let others = pool.filter(w => w !== target && w.pic !== target.pic);
  if (L === 3) { const same = others.filter(w => w.cat === target.cat); if (same.length >= n - 1) others = shuffle(same).concat(others); else others = shuffle(others); }
  else others = shuffle(others.filter(w => w.cat !== target.cat)).concat(shuffle(others.filter(w => w.cat === target.cat)));
  const opts = shuffle([target].concat(others.slice(0, n - 1)));
  promptBox(bigEar(() => stim()));
  const stim = (first) => Snd.say(first && c.first ? ["p:tap_picture", 200] : [], "w:" + target.id);
  SCR.ru = () => ruHelp("listen", "Слово: " + target.ru + ".");
  const ok = await choiceRound(c.tok, {
    game: "listen", key: "w:" + target.id, placement: c.placement,
    items: opts.map(w => ({ el: card(picEl(w)), ok: w === target })),
    stim, hint: () => Snd.say("w:" + target.id, 300, "ws:" + target.id),
    onCorrect: async (el, first) => { await Snd.say("w:" + target.id, 150, c.placement ? [] : [first ? praise() : "p:great6"]); },
  });
  return { ok, target };
};

/* 5. Tracing */
GAMES.trace = (c) => new Promise(resolve => {
  const L = lvl("trace");
  const pool = unlockedLetters();
  const l = choose(pool, x => "tr:" + x, c);
  const upper = (S.items["tr:" + l.toUpperCase()] || { n: 0 }).n <= (S.items["tr:" + l] || { n: 0 }).n;
  const ch = upper ? l.toUpperCase() : l;
  const strokes = window.GLYPHS[ch];
  const tol = [17, 14, 11][L - 1] + (c.easier ? 3 : 0);
  const wrap = h("div", { class: "trace-wrap" });
  const cv = h("canvas", { class: "trace-cv", "aria-label": "Trace the letter " + ch });
  const side = h("div", { class: "trace-side" },
    h("div", { class: "trace-model" }, letterFace(l, "pair")),
    h("button", { class: "round-btn", "aria-label": "Show me", onclick: () => demo(cur) }, icon("bulb")),
    h("button", { class: "round-btn", "aria-label": "Hear the sound", onclick: () => Snd.say("ph:" + C.letterSound[l]) }, icon("speaker")));
  wrap.append(cv, side); stage.append(wrap);
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, sc = 1, ox = 0, oy = 0, dpr = 1;
  function fit() {
    const r = cv.getBoundingClientRect(); dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr;
    sc = Math.min(W / 120, H / 150); ox = (W - 100 * sc) / 2; oy = (H - 140 * sc) / 2 - 4 * sc;
    draw();
  }
  const P = p => [ox + p[0] * sc, oy + p[1] * sc];
  const toBox = (x, y) => [(x - ox) / sc, (y - oy) / sc];
  const isDot = s => s.length <= 3;
  let cur = 0, prog = 0, tracing = false, strays = 0, demoT = null, demoProg = -1, demoIdx = -1, pulse = 0, finished = false;
  const done = [];
  function path(pts, upto = pts.length - 1) {
    ctx.beginPath(); const a = P(pts[0]); ctx.moveTo(a[0], a[1]);
    for (let i = 1; i <= Math.min(upto, pts.length - 1); i++) { const b = P(pts[i]); ctx.lineTo(b[0], b[1]); }
  }
  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || "#888"; }
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    // guide lines
    ctx.strokeStyle = css("--line"); ctx.lineWidth = 2;
    [[20, []], [60, [10, 10]], [110, []]].forEach(([y, d]) => { ctx.setLineDash(d); ctx.beginPath(); ctx.moveTo(ox - 10 * sc, oy + y * sc); ctx.lineTo(ox + 110 * sc, oy + y * sc); ctx.stroke(); });
    ctx.setLineDash([]);
    // template
    const lw = (L === 3 ? 13 : 17) * sc;
    strokes.forEach((s, i) => {
      ctx.lineWidth = isDot(s) ? lw * 1.1 : lw; ctx.strokeStyle = css(L === 3 ? "--trace-faint" : "--trace-bg");
      if (isDot(s)) { const a = P(s[0]); ctx.beginPath(); ctx.arc(a[0], a[1], lw / 2, 0, 7); ctx.fillStyle = ctx.strokeStyle; ctx.fill(); } else { path(s); ctx.stroke(); }
    });
    // finished strokes
    ctx.strokeStyle = css("--ink-trace"); ctx.fillStyle = css("--ink-trace");
    done.forEach(i => { const s = strokes[i]; ctx.lineWidth = lw * 0.7; if (isDot(s)) { const a = P(s[0]); ctx.beginPath(); ctx.arc(a[0], a[1], lw * 0.45, 0, 7); ctx.fill(); } else { path(s); ctx.stroke(); } });
    if (finished) return;
    const s = strokes[cur];
    // current progress
    if (prog > 0 && !isDot(s)) { ctx.lineWidth = lw * 0.7; path(s, prog); ctx.stroke(); }
    // demo ball
    if (demoProg >= 0 && demoIdx === cur && !isDot(s)) {
      ctx.strokeStyle = css("--demo"); ctx.lineWidth = lw * 0.35; ctx.setLineDash([2, 10]); path(s, Math.floor(demoProg)); ctx.stroke(); ctx.setLineDash([]);
      const p = P(s[Math.min(s.length - 1, Math.floor(demoProg))]); ctx.beginPath(); ctx.arc(p[0], p[1], lw * 0.42, 0, 7); ctx.fillStyle = css("--demo"); ctx.fill();
    }
    // direction arrows on current stroke
    if (!isDot(s) && L < 3) {
      ctx.fillStyle = css("--arrow");
      const marks = [0.3, 0.65].map(f => Math.floor(f * (s.length - 1)));
      marks.forEach(m => { if (m <= prog) return; const a = P(s[m]), b = P(s[Math.min(s.length - 1, m + 2)]); const ang = Math.atan2(b[1] - a[1], b[0] - a[0]); const z = lw * 0.32;
        ctx.save(); ctx.translate(a[0], a[1]); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(z, 0); ctx.lineTo(-z * 0.7, -z * 0.8); ctx.lineTo(-z * 0.7, z * 0.8); ctx.closePath(); ctx.fill(); ctx.restore(); });
    }
    // start dot (or current resume point)
    const sp = P(s[prog]); const pr = lw * 0.55 * (1 + 0.18 * Math.sin(pulse));
    ctx.beginPath(); ctx.arc(sp[0], sp[1], pr, 0, 7); ctx.fillStyle = css("--start"); ctx.fill();
    if (prog === 0) { ctx.fillStyle = "#fff"; ctx.font = `700 ${lw * 0.6}px Andika, system-ui`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(String(cur + 1), sp[0], sp[1] + 1); }
  }
  let raf = 0;
  function loop() { pulse += 0.12; draw(); if (alive(c.tok) && !finished) raf = requestAnimationFrame(loop); }
  function demo(i) {
    const s = strokes[i]; if (!s || isDot(s)) return;
    cancelAnimationFrame(demoT); demoProg = 0; demoIdx = i; const t0 = performance.now(); const dur = 900 + s.length * 12;
    const step = (t) => { demoProg = Math.min(s.length - 1, (t - t0) / dur * (s.length - 1)); if (demoProg < s.length - 1 && alive(c.tok)) demoT = requestAnimationFrame(step); else setTimeout(() => { demoProg = -1; }, 250); };
    demoT = requestAnimationFrame(step);
  }
  let lastNudge = 0;
  function nudge(key) { const t = Date.now(); if (t - lastNudge < 3500) return; lastNudge = t; strays++; Snd.say(key); }
  function local(e) { const r = cv.getBoundingClientRect(); return toBox(e.clientX - r.left, e.clientY - r.top); }
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  function completeStroke() {
    done.push(cur); cur++; prog = 0; tracing = false; cancelAnimationFrame(demoT); demoProg = -1;
    if (cur >= strokes.length) return finish();
    Snd.say("p:great6".replace("great6", pick(["great3", "great5", "great6"])));
    if (L === 1) setTimeout(() => demo(cur), 500);
  }
  cv.addEventListener("pointerdown", e => {
    if (finished) return; e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    const p = local(e), s = strokes[cur];
    if (isDot(s)) { if (dist(p, s[0]) < tol * 1.7) completeStroke(); else nudge("p:start_green"); return; }
    if (dist(p, s[prog]) < tol * 1.6) { tracing = true; demoProg = -1; }
    else nudge(prog === 0 ? "p:start_green" : "p:follow_line");
  });
  cv.addEventListener("pointermove", e => {
    if (!tracing || finished) return; e.preventDefault();
    const p = local(e), s = strokes[cur];
    let best = -1, bd = 1e9;
    for (let j = prog; j <= Math.min(s.length - 1, prog + 10); j++) { const d = dist(p, s[j]); if (d < bd) { bd = d; best = j; } }
    if (bd < tol && best > prog) prog = best;
    else if (dist(p, s[prog]) > tol * 2.4) { tracing = false; nudge("p:follow_line"); }
    if (prog >= s.length - 3) completeStroke();
  });
  const up = () => { tracing = false; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  async function finish() {
    finished = true; cancelAnimationFrame(raf); draw();
    const first = strays <= 1;
    record("trace", "tr:" + ch, first);
    confetti(cv);
    await Snd.say(praise(), 200, "p:this_letter", 100, "ph:" + C.letterSound[l]);
    await sleep(400);
    if (alive(c.tok)) resolve({ ok: first, target: l });
  }
  SCR.replay = () => { Snd.say("p:trace", 150, "ph:" + C.letterSound[l]); demo(cur); };
  SCR.ru = () => ruHelp("trace");
  requestAnimationFrame(() => { fit(); loop(); Snd.say(c.first ? ["p:trace", 200] : [], "ph:" + C.letterSound[l]); if (L <= 2) setTimeout(() => demo(0), 400); });
  window.addEventListener("resize", () => { if (alive(c.tok)) fit(); });
});

/* 6. Build a word */
function readyWords() {
  const ul = new Set(unlockedLetters());
  let ws = C.cvc.filter(w => w.split("").every(ch => ul.has(ch)));
  if (ws.length < 4) ws = uniq(ws.concat(["cat", "sun", "map", "dog", "pig", "bed", "hat", "bus"]));
  return ws;
}
GAMES.build = (c) => new Promise(resolve => {
  const L = lvl("build");
  const wid = choose(readyWords(), w => "bw:" + w, c);
  const letters = wid.split("");
  const extra = c.easier ? 0 : [0, 1, 2][L - 1];
  const dpool = shuffle("abcdefghilmnoprstuw".split("").filter(x => !letters.includes(x))).slice(0, extra);
  const tiles = shuffle(letters.concat(dpool));
  let tries = 0, finished = false;
  promptBox(h("button", { class: "prompt-pic", "aria-label": "Hear the word", onclick: () => Snd.say("w:" + wid) }, picEl(WORD[wid], "xl")));
  const slots = letters.map((ch, i) => h("div", { class: "slot", "data-i": i }, L === 1 ? h("span", { class: "ghost" }, ch) : null));
  const slotRow = h("div", { class: "slots" }, slots);
  const tray = h("div", { class: "tray" });
  stage.append(slotRow, tray);
  const filled = letters.map(() => false);
  const nextEmpty = () => filled.indexOf(false);
  function place(tile, i) {
    if (finished) return;
    const ch = tile.dataset.ch;
    if (i < 0 || filled[i]) { snapBack(tile); return; }
    if (letters[i] === ch) {
      filled[i] = true; slots[i].innerHTML = ""; slots[i].append(h("span", { class: "lt" }, ch)); slots[i].classList.add("filled");
      tile.classList.add("used"); tile.style.transform = ""; tile.disabled = true;
      Snd.say("ph:" + C.letterSound[ch]);
      if (nextEmpty() < 0) finish();
    } else {
      tries++; snapBack(tile); tile.classList.add("shake"); setTimeout(() => tile.classList.remove("shake"), 500);
      const need = letters[i];
      Snd.say("p:listen", 150, "ph:" + C.letterSound[need]);
      if (tries >= 2) { const good = $$(".tile:not(.used)", tray).find(t => t.dataset.ch === need); if (good) good.classList.add("glow"); }
    }
  }
  function snapBack(tile) { tile.style.transition = "transform .25s"; tile.style.transform = ""; setTimeout(() => { tile.style.transition = ""; }, 260); }
  tiles.forEach(ch => {
    const t = h("button", { class: "tile", "data-ch": ch, type: "button" }, h("span", { class: "lt" }, ch));
    let sx = 0, sy = 0, moved = false, dragging = false;
    t.addEventListener("pointerdown", e => { if (t.disabled) return; e.preventDefault(); dragging = true; moved = false; sx = e.clientX; sy = e.clientY; try { t.setPointerCapture(e.pointerId); } catch (_) {} t.classList.add("lift"); });
    t.addEventListener("pointermove", e => { if (!dragging) return; const dx = e.clientX - sx, dy = e.clientY - sy; if (Math.hypot(dx, dy) > 8) moved = true; if (moved) t.style.transform = `translate(${dx}px,${dy}px) scale(1.08)`; });
    const end = e => {
      if (!dragging) return; dragging = false; t.classList.remove("lift");
      if (!moved) { $$(".tile", tray).forEach(x => x.classList.remove("glow")); place(t, nextEmpty()); return; }
      let hit = -1;
      slots.forEach((s, i) => { const r = s.getBoundingClientRect(); if (e.clientX > r.left - 24 && e.clientX < r.right + 24 && e.clientY > r.top - 30 && e.clientY < r.bottom + 30) hit = i; });
      if (hit >= 0) { $$(".tile", tray).forEach(x => x.classList.remove("glow")); place(t, hit); } else snapBack(t);
    };
    t.addEventListener("pointerup", end); t.addEventListener("pointercancel", () => { dragging = false; t.classList.remove("lift"); snapBack(t); });
    tray.append(t);
  });
  async function finish() {
    finished = true;
    const first = tries === 0;
    record("build", "bw:" + wid, first);
    const seq = [];
    letters.forEach((ch, i) => { seq.push(() => { slots.forEach(s => s.classList.remove("lit")); slots[i].classList.add("lit"); }, "ph:" + C.letterSound[ch], 180); });
    seq.push(() => { slots.forEach(s => s.classList.remove("lit")); slotRow.classList.add("blend"); }, 150, "w:" + wid, 250, first ? praise() : "p:great6");
    if (first) confetti(slotRow);
    await Snd.say(seq); await sleep(300);
    if (alive(c.tok)) resolve({ ok: first, target: wid });
  }
  const stim = (first) => Snd.say(first && c.first ? ["p:build", 200] : [], "w:" + wid);
  SCR.replay = () => stim(false);
  SCR.ru = () => ruHelp("build", "Слово: " + WORD[wid].ru + ".");
  stim(true);
});

function shapeSVG(shape, color, size = "") {

  };
  return h("span", { class: "shape " + size, html: `<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="${fill}" stroke="rgba(0,0,0,.18)" stroke-width="3">${P[shape]}</g></svg>` });
}
GAMES.instr = (c) => new Promise(resolve => {
  const L = c.easier ? Math.max(1, lvl("instr") - 1) : lvl("instr");
  const list = C.instr.filter(i => i.level === L);
  const ins = choose(list, i => "i:" + i.id, c);
  let scene = [];
  if (L === 2) {
    const all = []; C.colors4.forEach(col => C.shapes.forEach(sh => all.push(col + "_" + sh)));
    scene = shuffle([ins.targets[0]].concat(shuffle(all.filter(x => x !== ins.targets[0])).slice(0, 5)));
  } else if (ins.targets[0].endsWith("_star")) {
    scene = shuffle(["big_star", "small_star", "sun", "moon", "apple", "ball"]);
  } else {
    const nouns = ["dog","cat","fish","bird","sun","car","apple","ball","house","tree"];
    scene = shuffle(uniq(ins.targets.concat(shuffle(nouns.filter(x => !ins.targets.includes(x))).slice(0, L === 1 ? 3 : 4))));
  }

  let step = 0, tries = 0, done = false;
  const els = scene.map(id => {

    if (id.includes("_star") && (id.startsWith("big") || id.startsWith("small"))) inner = h("span", { class: "pic emoji " + (id.startsWith("big") ? "xl" : "sm") }, "⭐");
    else if (id.includes("_")) { const [col, sh] = id.split("_"); inner = shapeSVG(sh, col); }

          await Snd.say(first ? praise() : "p:great6"); await sleep(300);
          if (alive(c.tok)) resolve({ ok: first, target: ins });

/* 9. Talk time (speak & listen) */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let srBlocked = false, micBlocked = false;
function listenOnce(lang = "en-US", ms = 6000) {
  return new Promise(res => {
    if (!SR || srBlocked) return res({ err: "none" });
    let r; try { r = new SR(); } catch (e) { return res({ err: "none" }); }
    r.lang = lang; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
    let got = null, finished = false;
    const fin = v => { if (finished) return; finished = true; try { r.abort(); } catch (e) {} res(v); };
    r.onresult = e => { const alts = []; for (const rs of e.results) for (const a of rs) alts.push(a.transcript.toLowerCase()); got = alts; fin({ alts }); };
    r.onerror = e => { if (e.error === "not-allowed" || e.error === "service-not-allowed") { srBlocked = true; fin({ err: "blocked" }); } else fin({ err: e.error || "x" }); };
    r.onend = () => fin(got ? { alts: got } : { err: "nothing" });
    setTimeout(() => fin(got ? { alts: got } : { err: "timeout" }), ms);
    try { r.start(); } catch (e) { fin({ err: "start" }); }
  });
}
async function recordClip(ms = 3000) {
  if (micBlocked || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) return null;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { micBlocked = true; return null; }
  return new Promise(res => {
    const chunks = []; let mr;
    try { mr = new MediaRecorder(stream); } catch (e) { stream.getTracks().forEach(t => t.stop()); return res(null); }
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => { stream.getTracks().forEach(t => t.stop()); res(chunks.length ? new Blob(chunks, { type: mr.mimeType || "audio/mp4" }) : null); };
    mr.start(); setTimeout(() => { try { mr.stop(); } catch (e) { res(null); } }, ms);
  });
}
async function playBlob(blob) {
  try { const b = await Snd.decode(await blob.arrayBuffer()); Snd.stop(); const s = Snd.ctx.createBufferSource(); s.buffer = b; s.connect(Snd.ctx.destination); s.start(0); await sleep(b.duration * 1000 + 100); } catch (e) {}
}
GAMES.speak = (c) => new Promise(resolve => {
  const ph = choose(C.phrases, p => "sp:" + p.id, c);
  const fin = async (heard) => {
    record("speak", "sp:" + ph.id, true);
    confetti(mainPic);
    await Snd.say(heard ? "p:heard_you" : praise()); await sleep(300);
    if (alive(c.tok)) resolve({ ok: true, target: ph.id });
  };
  const mainPic = h("button", { class: "prompt-pic talk-pic", "aria-label": "Hear it", onclick: () => Snd.say("f:" + ph.id) }, h("span", { class: "pic emoji xl" }, ph.pic));
  const phraseText = h("div", { class: "phrase-text" }, ph.en);
  const status = h("div", { class: "talk-status", "aria-live": "polite" });
  const micBtn = h("button", { class: "mic-btn", "aria-label": "Say it" }, icon("mic"));
  const thumb = h("button", { class: "mic-btn thumb", "aria-label": "I said it", hidden: true }, "👍");
  const slowBtn = h("button", { class: "round-btn", "aria-label": "Slow", onclick: () => Snd.say("fs:" + ph.id) }, h("span", { class: "emo-ic" }, "🐢"));
  const again = h("button", { class: "round-btn", "aria-label": "Play again", onclick: () => Snd.say("f:" + ph.id) }, icon("speaker"));
  const ctrls = h("div", { class: "talk-ctrls" }, again, slowBtn, micBtn, thumb);
  stage.append(h("div", { class: "talk" }, mainPic, phraseText, ctrls, status));
  const useThumb = () => { micBtn.hidden = true; thumb.hidden = false; status.textContent = ""; };
  thumb.onclick = () => fin(false);
  const showThumb = () => { thumb.hidden = false; };
  micBtn.onclick = async () => {
    if (micBtn.classList.contains("busy")) return;
    Snd.stop(); micBtn.classList.add("busy"); setTimeout(showThumb, 2500);
    if (SR && !srBlocked) {
      status.textContent = "…";
      const r = await listenOnce("en-US", 6000);
      micBtn.classList.remove("busy"); status.textContent = "";
      if (!alive(c.tok)) return;
      if (r.alts) {
        const heard = r.alts.join(" ");
        const hit = ph.keys.some(k => heard.includes(k));
        status.textContent = "“" + r.alts[0] + "”";
        if (hit) return fin(true);
        await Snd.say("p:good_try", 200, "f:" + ph.id);
        useThumb(); return; // never block progress
      }
      if (r.err !== "blocked" && r.err !== "none") { showThumb(); await Snd.say("p:try_again"); return; }
    }
    const blob = await recordClip(3000);
    micBtn.classList.remove("busy");
    if (!alive(c.tok)) return;
    if (blob) { status.textContent = ""; await playBlob(blob); await Snd.say(250, "f:" + ph.id); return fin(false); }
    useThumb(); Snd.say("p:your_turn");
  };
  if (!SR && !(navigator.mediaDevices && window.MediaRecorder)) useThumb();
  const stim = (first) => Snd.say(first && c.first ? ["p:say_it", 200] : [], "f:" + ph.id, 500, "p:your_turn");
  SCR.replay = () => stim(false);
  SCR.ru = () => { showBubble(ph.ru); speakTTS(ph.ru, "ru-RU"); };
  stim(true);
});

/* ---------------- Game runner ---------------- */
async function runGame(name, opt = {}) {
  const tok = newScreen({ game: name });
  const t0 = Run.ms;
  const budget = opt.budgetMs || Infinity, maxR = opt.rounds || Infinity;
  let r = 0, easier = false, reuse = null;
  while (alive(tok) && r < maxR && (r === 0 || Run.ms - t0 < budget)) {
    stage.innerHTML = "";
    stage.className = "stage game-" + name;
    const res = await GAMES[name]({ tok, first: r === 0, easier, reuse, review: !!opt.review });
    if (!alive(tok)) return false;
    r++;
    const ok = res && res.ok;
    easier = !ok; reuse = !ok && res ? res.target : null;
    await sleep(350);
  }
  return alive(tok);
}

/* ---------------- Daily lesson ---------------- */
function planLesson() {
  const L = S.settings.levels;
  const readingReady = S.unlocked.letters >= 5 && L.letter >= 2;
  const soundsEarly = L.firstsound === 1;
  return [
    { name: "Listen", ms: 120e3, segs: [["teach", 0.45], ["listen", 0.55]] },
    { name: "Sounds", ms: 180e3, segs: soundsEarly ? [["samediff", 0.4], ["firstsound", 0.6]] : [["firstsound", 0.7], ["samediff", 0.3]] },
    { name: "Letters", ms: 180e3, segs: [["letter", 0.6], ["trace", 0.4]] },
    { name: "Play", ms: 180e3, segs: readingReady ? [["build", 0.5], ["read", 0.5]] : [["instr", 0.5], ["speak", 0.5]] },
    { name: "Review", ms: 90e3, segs: [["review", 1]] },
  ];
}
async function startLesson() {
  const blocks = planLesson();
  const scale = S.settings.sessionMin / 12;
  const lesson = { blocks, i: 0 };
  Run.lesson = lesson;
  Run.session = { start: Date.now(), ms: 0, n: 0, c: 0, kind: "lesson" };
  for (let i = 0; i < blocks.length; i++) {
    if (Run.lesson !== lesson) return endSession(false);
    lesson.i = i;
    for (const [g, share] of blocks[i].segs) {
      if (Run.lesson !== lesson) return endSession(false);
      const budget = blocks[i].ms * scale * share;
      if (g === "teach") {
        const tok = newScreen({ game: "words" });
        const fresh = nextNewWords(S.settings.sessionMin <= 6 ? 2 : 3);
        if (fresh.length) {
          await teachWords(tok, fresh);
          if (!alive(tok)) return endSession(false);
          await miniQuiz(tok, fresh.map(w => w.id));
          if (!alive(tok)) return endSession(false);
        }
      } else if (g === "review") {
        const t0 = Run.ms; let r = 0;
        const pool = ["listen", "firstsound", "letter"];
        while (Run.lesson === lesson && (r === 0 || Run.ms - t0 < budget) && r < 6) {
          const tok = newScreen({ game: pool[r % 3] });
          if (r === 0) await Snd.say("p:lets_review");
          stage.className = "stage game-" + pool[r % 3];
          await GAMES[pool[r % 3]]({ tok, first: true, review: true });
          if (!alive(tok)) return endSession(false);
          r++; await sleep(300);
        }
      } else {
        await transition(g);
        if (Run.lesson !== lesson) return endSession(false);
        const ok = await runGame(g, { budgetMs: budget, rounds: 12 });
        if (!ok) return endSession(false);
      }
    }
  }
  if (Run.lesson === lesson) { lesson.i = blocks.length; S.lastLessonDay = today(); await reward(true); }
}
async function transition(g) {
  const tok = newScreen({ game: g, cls: "transition" });
  const info = GAME_INFO[g];
  stage.append(h("div", { class: "trans-card", style: `--tc:${info.color}` }, h("span", { class: "pic emoji xl" }, info.icon)));
  await Snd.say("p:next_game");
  await sleep(300);
  return alive(tok);
}
function endSession(completed) {
  if (Run.session) {
    S.sessions.push({ d: today(), ms: Run.session.ms, n: Run.session.n, c: Run.session.c, kind: Run.session.kind, done: completed });
    if (S.sessions.length > 120) S.sessions.shift();
    Run.session = null; save();
  }
}

/* ---------------- Placement ---------------- */
async function startPlacement() {
  const tok = newScreen({ game: "placement" });

  stage.append(h("div", { class: "hello" }, mascot("wave")));

    let miss = 0;
    for (let i = 0; i < rounds.length && alive(tok); i++) {
      stage.innerHTML = ""; stage.className = "stage placement";
      const ok = await fn(rounds[i], i);
      res[name][1]++; if (ok) res[name][0]++; else miss++;
      if (miss >= 2) break;
      await sleep(250);
    }
  };
  const listenWith = (pool, n) => async (id, i) => {
    const prevL = S.settings.levels.listen; S.settings.levels.listen = n === 2 ? 1 : 2;
    const r = await GAMES.listen({ tok, first: i === 0, placement: true, pool, reuse: WORD[id] });
    S.settings.levels.listen = prevL; return r.ok;
  };
  await sec("listening", ["dog", "apple", "car"], listenWith(["dog","apple","car","cat","banana","ball","sun","fish"], 2));
  await sec("vocabulary", ["elephant", "umbrella", "scissors"], listenWith(["elephant","umbrella","scissors","teacher","rocket","violin","whale","pencil","grapes"], 3));
  const fsL = S.settings.levels.firstsound; S.settings.levels.firstsound = 1;
  await sec("beginning", [["m", "moon"], ["s", "sun"], ["b", "ball"]], async ([s, w], i) => (await GAMES.firstsound({ tok, first: i === 0, placement: true, reuse: s, word: w, placementSounds: ["m", "s", "b", "t", "f"] })).ok);
  S.settings.levels.firstsound = fsL;
  await sec("letters", ["m", "s", "b"], async (l, i) => {
    const opts = shuffle([l].concat(shuffle(["t", "a", "p", "d", "o"]).slice(0, 2)));
    promptBox(bigEar(() => Snd.say("p:find_letter", 100, "ln:" + l)));
    return choiceRound(tok, { game: "letter", key: "pl:" + l, placement: true, cls: "letter-opts",
      items: opts.map(x => ({ el: card(letterFace(x, "upper"), "lt-card"), ok: x === l })),
      stim: () => Snd.say("p:find_letter", 100, "ln:" + l), onCorrect: () => Snd.say(praise()) });
  });
  if (res.letters[0] >= 2) await sec("reading", ["cat", "sun"], async (w, i) => {
    const others = shuffle(["dog", "bed", "pig", "map"]).slice(0, 2);
    const word = h("div", { class: "read-word" }, w.split("").map(ch => h("span", { class: "rl" }, ch)));
    promptBox(word);
    return choiceRound(tok, { game: "read", key: "pl:" + w, placement: true,
      items: shuffle([w].concat(others)).map(x => ({ el: card(picEl(WORD[x])), ok: x === w })),
      stim: (f) => f && i === 0 ? Snd.say("p:read_find") : Promise.resolve(), onCorrect: () => Snd.say("w:" + w, 200, praise()) });
  });
  if (!alive(tok)) return;
  applyPlacement(res);
  await reward(false);
}
function applyPlacement(res) {
  const ok = k => res[k][0];
  const L = S.settings.levels;
  L.listen = ok("listening") < 2 ? 1 : ok("vocabulary") >= 2 ? 3 : 2;
  L.instr = ok("listening") < 2 ? 1 : 2;
  L.firstsound = ok("beginning") >= 3 ? 2 : 1;
  L.samediff = ok("beginning") >= 2 ? 2 : 1;
  L.letter = ok("letters") >= 3 ? 2 : 1;
  L.read = 1; L.build = 1; L.trace = 1;
  S.unlocked.sounds = ok("beginning") >= 3 ? 5 : 3;
  S.unlocked.letters = ok("letters") >= 3 ? (ok("reading") >= 2 ? 8 : 6) : 3;
  if (ok("vocabulary") >= 2) S.introduced = uniq(S.introduced.concat(["elephant", "umbrella", "scissors", "teacher", "rocket", "whale", "pencil"]));
  S.placement = { d: today(), res };
  S.placementDone = true; save(true);
}
